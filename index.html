<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speed Lab Grand Prix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aleo:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#053F5B;--purple:#795192;--green:#62A043;--pink:#E57B91;--blue:#056891;
  --yellow:#FFDD4F;--sky:#A6DFF6;--coral:#F36E4E;--cream:#FFF1E4;
  --ink:#0d2633;--muted:#5b6f7a;--line:#dbe4ea;--bg:#f6f9fb;--card:#fff;
  --ok:#3f8a2a;--okbg:#eaf5e4;--bad:#c2412a;--badbg:#fdece8;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:Aleo,Rockwell,Georgia,serif;margin:0;line-height:1.15;color:var(--navy)}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:700;background:var(--navy);color:#fff;min-height:48px;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.green{background:var(--green)}.btn.purple{background:var(--purple)}.btn.pink{background:var(--pink)}.btn.coral{background:var(--coral)}.btn.blue{background:var(--blue)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--purple)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
input.field{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:12px;font-size:18px;background:#fff}
input.field:focus{outline:none;border-color:var(--blue)}
.code-in{text-transform:uppercase;letter-spacing:.3em;font-weight:800;text-align:center;font-size:28px!important}
.center{text-align:center}
.hide{display:none!important}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
.bar .brand{font-family:Aleo,Rockwell,serif;font-weight:800;font-size:18px}
.bar .pill{background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
.bar .pill.timer{background:var(--yellow);color:var(--navy)}
.bar .pill.warn{background:var(--coral)}

/* avatar */
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;width:var(--s);height:var(--s);min-width:var(--s);border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.av-e{font-size:calc(var(--s)*.56);line-height:1}
.av-r{position:absolute;right:-4px;bottom:-4px;font-size:calc(var(--s)*.36);background:#fff;border-radius:50%;width:calc(var(--s)*.48);height:calc(var(--s)*.48);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* choice grids */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.choice{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;font-weight:600;min-height:56px;display:flex;align-items:center;gap:10px}
.choice:hover{border-color:var(--sky)}
.choice.on{border-color:var(--blue);background:#eef8fd;box-shadow:0 0 0 3px var(--sky)}
.choice .big{font-size:30px}
.swatch{width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.swatch.on{box-shadow:0 0 0 4px var(--blue)}
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--green)}

/* lesson parts */
.ctx{background:var(--cream);border-radius:14px;padding:16px 18px;font-size:18px;line-height:1.5}
.part{border-top:1px solid var(--line);padding:18px 0 6px}
.part:first-of-type{border-top:0}
.part h3{font-family:Poppins,Arial,sans-serif;font-size:19px;font-weight:700;color:var(--ink);margin-bottom:10px}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-bottom:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;text-align:left;font-weight:600;min-height:52px}
.opt.on{border-color:var(--blue);background:#eef8fd}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt[disabled]{cursor:default}
.ans-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans-row input.field{max-width:220px}
.unit{font-weight:600;color:var(--muted)}
.fb{margin-top:10px;padding:12px 14px;border-radius:12px;font-weight:600;line-height:1.45}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.info{background:#eef4ff;color:var(--blue)}
.fb.reveal{background:#f3ecf7;color:var(--purple)}
.dnl{width:100%;height:auto;display:block;margin:6px 0 10px}
.banner{padding:12px 16px;border-radius:12px;font-weight:700;margin:12px 0}
.banner.lock{background:var(--yellow);color:var(--navy)}
.banner.rev{background:#f3ecf7;color:var(--purple)}

/* markup */
.mk{font-size:22px;line-height:2.1;margin:10px 0}
.mk .w{padding:2px 4px;border-radius:6px;cursor:pointer;user-select:none;-webkit-user-select:none}
.mk .w.on{background:var(--yellow);box-shadow:0 0 0 2px #f2c400 inset}
.mk .w.key{text-decoration:underline 3px var(--purple);text-underline-offset:5px}

/* freeze overlay */
.freeze{position:fixed;inset:0;z-index:100;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.freeze .eyes{font-size:110px;animation:bob 1.6s ease-in-out infinite}
.freeze h1{color:#fff;font-size:44px;margin-top:10px}
@keyframes bob{50%{transform:translateY(-10px)}}

/* track */
.track{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;overflow:hidden}
.lane{position:relative;height:46px;border-bottom:1px dashed var(--line)}
.lane:last-child{border-bottom:0}
.lane .runner{position:absolute;top:4px;left:0;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:left .5s ease}
.lane .runner.live{transition:none}
.lane .nm{font-size:13px;font-weight:700;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:6px}
.lane .dist{font-size:12px;font-weight:700;color:var(--blue)}
.finish{position:absolute;top:0;bottom:0;right:44px;width:6px;background:repeating-linear-gradient(0deg,var(--navy) 0 6px,#fff 6px 12px);opacity:.7}
.ticks{position:relative;height:20px;margin:0 0 4px}
.ticks span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);font-weight:600}

/* host */
.host{display:grid;grid-template-columns:230px 1fr 400px;gap:14px;padding:14px;align-items:start}
.flow{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.flow button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:14px}
.flow button .ph{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.flow button.cur{background:var(--navy);color:#fff}
.flow button.cur .ph{color:var(--sky)}
.flow button.done{opacity:.6}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;position:sticky;top:62px;z-index:5}
.ctrl .btn{min-height:44px;padding:10px 16px}
.ctrl .on{box-shadow:0 0 0 3px var(--yellow)}
.notes{background:var(--cream);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.5}
.notes b{color:var(--navy)}
.notes ul{margin:4px 0 8px;padding-left:18px}
.stat{display:flex;align-items:baseline;gap:8px}
.stat .n{font-size:34px;font-weight:800;color:var(--navy)}
.bars .b{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}
.bars .b .t{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bars .b .f{height:16px;border-radius:8px;background:var(--sky)}
.bars .b .f.c{background:var(--green)}
.bars .b .f.m{background:var(--coral)}
table.ros{width:100%;border-collapse:collapse;font-size:13px}
table.ros th,table.ros td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.ros td.c{text-align:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#bbb;margin-right:4px}
.dot.on{background:var(--green)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--line)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.mid{background:#fff6cc;color:#7a5d00}.chip.mis{background:var(--coral);color:#fff}
.code-big{font-family:Aleo,Rockwell,serif;font-weight:800;font-size:56px;letter-spacing:.12em;color:var(--navy)}
.heat .w{padding:2px 3px;border-radius:5px}
.proj{padding:24px 32px}
.proj h1{font-size:44px}
.proj .ctx{font-size:26px}
.proj-ctrl{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(5,63,91,.92);padding:8px;border-radius:999px;z-index:30;opacity:.25;transition:opacity .2s}
.proj-ctrl:hover,.proj-ctrl:focus-within{opacity:1}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;z-index:200;font-weight:600}
.status{padding:8px 12px;border-radius:10px;background:#fff6cc;color:#7a5d00;font-weight:600;font-size:14px;margin:8px 0}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:20px 0}
.podium .p{text-align:center}
.podium .blk{background:var(--navy);color:#fff;border-radius:12px 12px 0 0;width:120px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:Aleo,serif;font-weight:800;font-size:30px}
@media (max-width:1150px){.host{grid-template-columns:1fr}.flow{position:static;max-height:none;display:flex;overflow-x:auto;gap:4px}.flow button{min-width:150px}}
@media (max-width:600px){.wrap{padding:12px}.card{padding:16px}.ctx{font-size:17px}.mk{font-size:19px}.bar .brand{font-size:15px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<script>
"use strict";
/* =====================================================================
   SPEED LAB GRAND PRIX — G6 M2 Lesson 9: Constant Speed
   Teacher hosts (?host). Scholars join with a 4-letter room code.
   Sync: PeerJS (WebRTC) by default; ?net=local uses BroadcastChannel
   (same-device demo/testing).
   ===================================================================== */
const PARAMS = new URLSearchParams(location.search);
const NET_MODE = PARAMS.get('net') === 'local' ? 'local' : 'peer';
const IS_HOST = PARAMS.has('host');
const PREFIX = 'momentum-tgs-speedlab-l9-';
const PEER_OPTS = { debug: 0, config: { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' } ] } };
const TEACHER = 'Mr. Shaw';

/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round(n * 100) / 100;
const fmt = n => (n == null || isNaN(n)) ? '—' : String(r2(n));
const near = (a, b) => Math.abs(a - b) <= Math.max(0.02, Math.abs(b) * 0.06);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
  del(k) { try { localStorage.removeItem(k); } catch (_) {} }
};
function parseNum(s) {
  if (s == null) return null;
  s = String(s).trim().replace(/,/g, '.');
  const fr = s.match(/^(-?\d*\.?\d+)\s*\/\s*(\d*\.?\d+)$/);
  if (fr) { const d = parseFloat(fr[2]); return d ? parseFloat(fr[1]) / d : null; }
  const m = s.match(/-?\d*\.?\d+/);
  return m ? parseFloat(m[0]) : null;
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
let peerLib;
function loadPeerLib() {
  if (window.Peer) return Promise.resolve();
  if (!peerLib) peerLib = loadScript('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js')
    .catch(() => loadScript('https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'));
  return peerLib;
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------------- characters ---------------- */
const ARCH = {
  cheetah: { e: '🐆', name: 'The Bold Sprinter', d: 'You jump in first and bring the energy.' },
  turtle: { e: '🐢', name: 'The Steady Strategist', d: 'Constant and unstoppable — you never quit.' },
  robot: { e: '🤖', name: 'The Precise Calculator', d: 'You check every detail before you move.' },
  falcon: { e: '🦅', name: 'The Big-Picture Planner', d: 'You see the whole route before you go.' },
  dolphin: { e: '🐬', name: 'The Team Captain', d: 'You make sure nobody gets left behind.' },
  fox: { e: '🦊', name: 'The Clever Problem-Solver', d: 'You find the smart shortcut.' },
  dragon: { e: '🐉', name: 'The Fearless Challenger', d: 'Hard problems? You run toward them.' },
  octopus: { e: '🐙', name: 'The Creative Multitasker', d: 'You see ideas nobody else sees.' }
};
const VIBE = [
  { q: 'In a group project, you’re usually the one who…', w: 3, opts: [
    ['Jumps in first', 'cheetah'], ['Keeps everyone calm and steady', 'turtle'], ['Double-checks every detail', 'robot'], ['Plans the big picture', 'falcon'],
    ['Makes sure everyone is included', 'dolphin'], ['Finds the clever shortcut', 'fox'], ['Takes on the hardest part', 'dragon'], ['Comes up with creative ideas', 'octopus']] },
  { q: 'Pick your perfect Saturday:', w: 2, opts: [
    ['Racing friends at the park', 'cheetah dragon'], ['Building or fixing something', 'robot fox'], ['Drawing, music, or making videos', 'octopus'],
    ['Hanging out with family & friends', 'dolphin turtle'], ['Exploring somewhere new', 'falcon fox'], ['Beating a hard level in a game', 'dragon robot']] },
  { q: 'When something gets tough, you…', w: 2, opts: [
    ['Push through — go, go, go!', 'cheetah'], ['Slow down and stay steady', 'turtle'], ['Break it into small steps', 'robot'], ['Ask the team for ideas', 'dolphin'],
    ['Try a totally new way', 'octopus'], ['Step back and see the big picture', 'falcon']] }
];
const RIDES = {
  sneakers: { e: '👟', n: 'Sneakers', like: 'Sports & running' }, skate: { e: '🛹', n: 'Skateboard', like: 'Tricks & style' },
  bike: { e: '🚲', n: 'Bike', like: 'Being outside' }, scooter: { e: '🛴', n: 'Scooter', like: 'Cruising with friends' },
  car: { e: '🏎️', n: 'Race car', like: 'Cars & speed' }, rocket: { e: '🚀', n: 'Rocket', like: 'Space & science' },
  skates: { e: '🛼', n: 'Roller skates', like: 'Music & dancing' }, horse: { e: '🐎', n: 'Horse', like: 'Animals & nature' }
};
const COLORS = { navy: '#053F5B', purple: '#795192', green: '#62A043', pink: '#E57B91', blue: '#056891', yellow: '#FFDD4F', coral: '#F36E4E', sky: '#A6DFF6' };
const PHRASES = ['Constant and unstoppable!', 'Per second, every second.', 'Zoom zoom!', 'Math is my fuel.', 'Can’t catch me!', 'Steady wins the race.', 'Let’s ride!', 'Faster? Prove it.'];
function avatar(pr, size = 44) {
  const a = ARCH[pr?.arch]; const r = RIDES[pr?.ride]; const c = COLORS[pr?.color] || '#dbe4ea';
  return `<span class="av" style="--c:${c};--s:${size}px"><span class="av-e">${a ? a.e : '❔'}</span>${r ? `<span class="av-r">${r.e}</span>` : ''}</span>`;
}
function cleanProfile(p) {
  if (!p || typeof p !== 'object') return null;
  if (!ARCH[p.arch] || !RIDES[p.ride] || !COLORS[p.color]) return null;
  return { arch: p.arch, ride: p.ride, color: p.color, phrase: PHRASES.includes(p.phrase) ? p.phrase : PHRASES[0] };
}
const cleanName = s => String(s || '').replace(/[^\p{L}\p{N} .'\-]/gu, '').trim().slice(0, 16) || 'Scholar';

/* ---------------- misconceptions (from the teacher guide) ---------------- */
const MIS = {
  'WRONG-WAY': { t: 'Multiplied by 10 instead of dividing', h: 'Dividing by 10 makes a number SMALLER. Each digit moves one place to the right.' },
  'PLACES': { t: 'Shifted the wrong number of places', h: 'Check the place value: ÷10 shifts digits one place smaller, ÷100 shifts two places.' },
  'REMAINDER': { t: 'Left a remainder instead of tenths', h: '10 goes into 34 three times with 4 left over — that leftover is 4 TENTHS. Write it as a decimal.' },
  'INV': { t: 'Divided time ÷ distance (seconds per meter)', h: 'That number tells how many SECONDS it takes to go 1 meter. We want how many METERS in 1 second: distance ÷ time.' },
  'DIST-ONLY': { t: 'Judged speed by distance only', h: 'Farther doesn’t always mean faster — you have to check the TIME too.' },
  'TIME-BIGGER': { t: 'Thinks more time = faster', h: 'Same distance in LESS time is faster.' },
  'NOT-10X': { t: 'Gave the 1-second distance, not 10 seconds', h: 'That’s how far you go in ONE second. At this rate, how far in TEN seconds?' }
};

/* ---------------- double number line ---------------- */
function dnlSVG(o) {
  const n = o.n, W = 600, H = 156, x0 = 26, x1 = W - 26, yT = 46, yB = 100;
  const X = i => x0 + (x1 - x0) * i / n;
  let s = `<svg class="dnl" viewBox="0 0 ${W} ${H}" role="img" aria-label="Double number line: ${esc(o.topLabel || 'Distance traveled (meters)')} over ${esc(o.botLabel || 'Elapsed time (seconds)')}">`;
  s += `<text x="${x0}" y="14" font-size="13" font-weight="700" fill="#5b6f7a">${esc(o.topLabel || 'Distance traveled (meters)')}</text>`;
  s += `<text x="${x0}" y="${H - 2}" font-size="13" font-weight="700" fill="#5b6f7a">${esc(o.botLabel || 'Elapsed time (seconds)')}</text>`;
  s += `<line x1="${x0 - 8}" y1="${yT}" x2="${x1 + 8}" y2="${yT}" stroke="#053F5B" stroke-width="3"/><line x1="${x0 - 8}" y1="${yB}" x2="${x1 + 8}" y2="${yB}" stroke="#053F5B" stroke-width="3"/>`;
  const fs = n > 20 ? 11 : 15;
  for (let i = 0; i <= n; i++) {
    const x = X(i), hi = (o.hi === i);
    if (hi) s += `<rect x="${x - 16}" y="${yT - 30}" width="32" height="${yB - yT + 52}" rx="8" fill="#FFDD4F" opacity=".35"/>`;
    s += `<line x1="${x}" y1="${yT - 7}" x2="${x}" y2="${yT + 7}" stroke="#053F5B" stroke-width="2"/><line x1="${x}" y1="${yB - 7}" x2="${x}" y2="${yB + 7}" stroke="#053F5B" stroke-width="2"/>`;
    const t = o.top?.[i] ?? '', b = o.bot?.[i] ?? '';
    if (t !== '') s += `<text x="${x}" y="${yT - 13}" text-anchor="middle" font-size="${t === '?' ? 20 : fs}" font-weight="800" fill="${t === '?' ? '#E57B91' : '#053F5B'}">${esc(t)}</text>`;
    if (b !== '') s += `<text x="${x}" y="${yB + 24}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#056891">${esc(b)}</text>`;
  }
  return s + '</svg>';
}
function ownDNL(t, ans) { // 10 m in t seconds; ? at 1 second
  t = Math.max(1, Math.round(t)); const top = [], bot = [];
  for (let i = 0; i <= t; i++) { top.push(i === 0 ? '0' : i === t ? '10' : i === 1 ? (ans != null ? fmt(ans) : '?') : ''); bot.push(i === 0 || i === 1 || i === t || (t <= 12) ? String(i) : ''); }
  return dnlSVG({ n: t, top, bot, hi: 1 });
}
function fixedDNL(dist, secs, ans) {
  const top = [], bot = [];
  for (let i = 0; i <= secs; i++) { top.push(i === 0 ? '0' : i === secs ? String(dist) : i === 1 ? (ans != null ? fmt(ans) : '?') : ''); bot.push(String(i)); }
  return dnlSVG({ n: secs, top, bot, hi: 1 });
}
function trainA() { const top = [], bot = []; for (let i = 0; i <= 8; i++) { top.push(i === 0 ? '0' : i === 1 ? '12.5' : i === 8 ? '100' : ''); bot.push(i === 0 ? '0' : i === 1 ? '1' : ''); } return dnlSVG({ n: 8, top, bot }); }

function checkPart(part, v, p) {
  if (part.kind === 'num') {
    const n = parseNum(v); if (n == null) return null;
    const ans = val(part.answer, p); if (ans == null || isNaN(ans)) return null;
    const tol = part.rel ? Math.max(part.min || 0, Math.abs(ans) * part.rel) : 1e-6;
    const ok = Math.abs(n - ans) <= tol + 1e-9;
    return { v: n, ok, mis: ok ? null : (part.misc ? part.misc(n, p) : null) };
  }
  if (part.kind === 'mc') {
    const i = parseInt(v, 10); if (!(i >= 0 && i < part.options.length)) return null;
    const ok = i === val(part.answer, p);
    return { v: i, ok, mis: ok ? null : (part.mis?.[i] || null) };
  }
  if (part.kind === 'multi') {
    if (!Array.isArray(v)) return null;
    const set = [...new Set(v.map(Number).filter(i => i >= 0 && i < part.options.length))].sort();
    if (!set.length) return null;
    const ok = JSON.stringify(set) === JSON.stringify(part.answer);
    return { v: set, ok, mis: null };
  }
  if (part.kind === 'poll') { const i = parseInt(v, 10); if (!(i >= 0 && i < part.options.length)) return null; return { v: i, ok: null, mis: null }; }
  if (part.kind === 'text') { const t = String(v || '').trim().slice(0, 400); if (!t) return null; return { v: t, ok: null, mis: null }; }
  return null;
}

async function hostNet(code, h) {
  if (NET_MODE === 'local') {
    const ch = new BroadcastChannel('speedlab-' + code);
    ch.onmessage = e => { const d = e.data; if (d && d.from && d.msg) h.onMsg(String(d.from).slice(0, 40), d.msg); };
    setTimeout(h.onOpen, 0);
    return { send(pid, msg) { ch.postMessage({ to: pid, msg }); }, close() { ch.close(); } };
  }
  await loadPeerLib();
  const conns = new Map();
  const peer = new Peer(PREFIX + code.toLowerCase(), PEER_OPTS);
  peer.on('open', () => h.onOpen());
  peer.on('error', e => h.onError(e));
  peer.on('disconnected', () => setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (_) {} }, 1500));
  peer.on('connection', conn => {
    let pid = null;
    conn.on('data', msg => {
      if (!msg || typeof msg !== 'object') return;
      if (msg.t === 'hello' && typeof msg.pid === 'string') {
        pid = msg.pid.slice(0, 40); const old = conns.get(pid);
        if (old && old !== conn) try { old.close(); } catch (_) {}
        conns.set(pid, conn);
      }
      if (pid) h.onMsg(pid, msg);
    });
    conn.on('close', () => { if (pid && conns.get(pid) === conn) { conns.delete(pid); h.onMsg(pid, { t: 'bye' }); } });
    conn.on('error', () => {});
  });
  return { send(pid, msg) { const c = conns.get(pid); if (c && c.open) try { c.send(msg); } catch (_) {} }, close() { try { peer.destroy(); } catch (_) {} } };
}
async function clientNet(code, pid, h) {
  if (NET_MODE === 'local') {
    const ch = new BroadcastChannel('speedlab-' + code);
    ch.onmessage = e => { const d = e.data; if (d && (d.to === pid || d.to === '*')) h.onMsg(d.msg); };
    const api = { send(msg) { ch.postMessage({ from: pid, msg }); }, close() { ch.close(); } };
    setTimeout(h.onOpen, 0);
    return api;
  }
  await loadPeerLib();
  let peer, conn, closed = false, retryT = 0;
  const later = (fn, ms) => { clearTimeout(retryT); retryT = setTimeout(fn, ms); };
  function start() {
    try { peer && peer.destroy(); } catch (_) {}
    peer = new Peer(undefined, PEER_OPTS);
    peer.on('open', connect);
    peer.on('disconnected', () => { try { if (!peer.destroyed) peer.reconnect(); } catch (_) {} });
    peer.on('error', e => {
      if (closed) return;
      if (e.type === 'peer-unavailable') { h.onStatus('noroom'); later(connect, 3000); }
      else { h.onStatus('offline'); later(start, 4000); }
    });
  }
  function connect() {
    if (closed) return;
    if (conn) try { conn.close(); } catch (_) {}
    h.onStatus('connecting');
    const c = peer.connect(PREFIX + code.toLowerCase(), { reliable: true, serialization: 'json' });
    conn = c;
    const to = setTimeout(() => { if (!c.open && conn === c) { try { c.close(); } catch (_) {} later(connect, 800); } }, 9000);
    c.on('open', () => { clearTimeout(to); h.onOpen(); });
    c.on('data', m => h.onMsg(m));
    c.on('close', () => { if (conn === c && !closed) { h.onStatus('reconnecting'); later(connect, 2000); } });
    c.on('error', () => {});
  }
  start();
  return { send(m) { if (conn && conn.open) try { conn.send(m); } catch (_) {} }, close() { closed = true; try { peer.destroy(); } catch (_) {} } };
}

  let h = `<div class="card">${head}${lockBanner()}`;
  if (s.exit) h += `<details class="ctx" style="font-size:15px;margin-bottom:12px" ${V.revealed ? '' : 'open'}><summary><b>Criteria for success</b></summary><ol style="margin:6px 0 0">${SCREENS[SIDX.cfs].items.map(x => `<li>${esc(x)}</li>`).join('')}</ol></details>`;
  if (s.context) h += `<div class="ctx">${s.context}</div>`;
  if (s.diagrams) h += s.diagrams.map(([n, f]) => `<div style="margin-top:12px"><b>${n}</b>${f === 'trainA' ? trainA() : trainB()}</div>`).join('');
  if (s.needsData && !me.data) return h + `<div class="fb info">First, record your Activity 1 times.</div>${dataForm()}</div>`;
  for (const pt of s.parts) h += partHTML(s, pt, me.ans[pt.id], me);
  return h + '</div>';
}
function partHTML(s, pt, r, me) {
  const key = `${s.id}.${pt.id}`;
  const done = r && r.final, dis = V.locked || V.revealed || done;
  const hideResult = s.exit && !V.revealed;
  let h = `<div class="part"><h3>${esc(pt.prompt)}</h3>`;
  if (pt.own === 'slow' || pt.own === 'fast') h += `<div class="small muted">Your data: 10 meters in ${me.data[pt.own]} seconds</div>` + ownDNL(me.data[pt.own], V.revealed ? val(pt.answer, me) : null);
  if (pt.own === 'fast10') h += `<div class="small muted">Your quick time: 10 meters in ${me.data.fast} seconds</div>`;
  if (pt.dnl) h += fixedDNL(pt.dnl[0], pt.dnl[1], V.revealed ? pt.answer : null);
  if (pt.kind === 'num' || pt.kind === 'text') {
    const v = r ? r.v : '';
    h += `<div class="ans-row">${pt.kind === 'num' ? `<input class="field" data-draft="${key}" id="in-${key}" inputmode="decimal" autocomplete="off" ${dis ? 'disabled' : ''} value="${esc(done ? v : '')}" placeholder="?">` : `<input class="field" style="max-width:100%" data-draft="${key}" id="in-${key}" autocomplete="off" maxlength="400" ${dis ? 'disabled' : ''} value="${esc(done ? v : '')}" placeholder="${esc(pt.ph || '')}">`}
      ${pt.unit ? `<span class="unit">${esc(pt.unit)}</span>` : ''}${!dis ? `<button class="btn" data-check="${pt.id}">${s.exit || pt.kind === 'text' ? 'Submit' : 'Check'}</button>` : ''}</div>`;
  } else {
    const sel = done ? r.v : drafts[key];
    const right = V.revealed ? val(pt.answer, me) : null;
    h += `<div class="opts">${pt.options.map((o, i) => { const on = pt.kind === 'multi' ? (Array.isArray(sel) && sel.includes(i)) : sel === i; const isR = right != null && (Array.isArray(right) ? right.includes(i) : right === i); return `<button class="opt ${on ? 'on' : ''} ${isR ? 'right' : ''}" data-opt="${pt.id}" data-i="${i}" ${dis ? 'disabled' : ''}>${pt.kind === 'multi' ? (on ? '☑ ' : '☐ ') : ''}${esc(o)}</button>`; }).join('')}</div>`;
    if (!dis) h += `<button class="btn" data-check="${pt.id}">${s.exit || pt.kind === 'poll' ? 'Submit' : 'Check'}</button>`;
  }
  // feedback
  if (r) {
    if (pt.kind === 'poll' || pt.kind === 'text') h += `<div class="fb info">Submitted ✓</div>`;
    else if (hideResult) h += `<div class="fb info">Submitted ✓ — results after ${TEACHER} reveals.</div>`;
    else if (r.ok) h += `<div class="fb ok">✅ ${r.tries === 1 ? 'Nailed it! +100 ⚡' : 'Got it on the retry! +50 ⚡'}</div>`;
    else if (!r.final) h += `<div class="fb bad">${pt.kind === 'num' ? `You answered ${esc(r.v)}. ` : ''}Not yet — one more try.${r.mis && MIS[r.mis] ? ' ' + esc(MIS[r.mis].h) : pt.hint ? ' ' + esc(pt.hint) : ''}</div>`;
    else h += `<div class="fb bad">Not quite. ${r.mis && MIS[r.mis] ? esc(MIS[r.mis].h) + ' ' : ''}We’ll talk it through together.</div>`;
  } else if (!dis && pt.kind === 'num' && pt.unit) h += `<div class="small muted" style="margin-top:6px">Decimals are OK (like 2.5).</div>`;
  if (V.revealed && pt.explain) h += `<div class="fb reveal">💡 ${esc(val(pt.explain, me))}</div>`;
  return h + '</div>';
}

/* ---------- character builder ---------- */
function builderHTML() {
  const B = S.builder = S.builder || { step: 0, picks: [] };
  const N = VIBE.length + 3; // vibe Qs, ride, color, reveal
  const steps = `<div class="steps">${Array.from({ length: N }, (_, i) => `<i class="${i <= B.step ? 'on' : ''}"></i>`).join('')}</div>`;
  let h = `<div class="card">${steps}`;
  if (B.step < VIBE.length) {
    const q = VIBE[B.step];
    h += `<span class="tag">Build your racer · ${B.step + 1} of ${N}</span><h2 style="margin:6px 0 14px">${esc(q.q)}</h2><div class="grid">${q.opts.map((o, i) => `<button class="choice ${B.picks[B.step] === i ? 'on' : ''}" data-b="pick" data-i="${i}">${esc(o[0])}</button>`).join('')}</div>`;
  } else if (B.step === VIBE.length) {
    h += `<span class="tag">Build your racer · ${B.step + 1} of ${N}</span><h2 style="margin:6px 0 14px">What do you like? Pick your ride.</h2><div class="grid">${Object.entries(RIDES).map(([k, r]) => `<button class="choice ${B.ride === k ? 'on' : ''}" data-b="ride" data-i="${k}"><span class="big">${r.e}</span><span>${esc(r.n)}<br><span class="small muted">${esc(r.like)}</span></span></button>`).join('')}</div>`;
  } else if (B.step === VIBE.length + 1) {
    h += `<span class="tag">Build your racer · ${B.step + 1} of ${N}</span><h2 style="margin:6px 0 14px">Pick your team color</h2><div class="row" style="gap:14px">${Object.entries(COLORS).map(([k, c]) => `<button class="swatch ${B.color === k ? 'on' : ''}" style="background:${c}" aria-label="${k}" data-b="color" data-i="${k}"></button>`).join('')}</div>`;
  } else {
    if (!B.arch) B.arch = scoreVibe(B.picks);
    if (!B.phrase) B.phrase = PHRASES[0];
    const a = ARCH[B.arch], pr = { arch: B.arch, ride: B.ride, color: B.color };
    h += `<div class="center">${avatar(pr, 120)}<div class="tag" style="margin-top:12px">Your racer</div><h1>${esc(a.name)}</h1><p class="muted" style="font-size:18px">${esc(a.d)}</p></div>
      <h3 style="font-size:16px;margin:16px 0 8px">Not you? Pick a different racer:</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${Object.entries(ARCH).map(([k, x]) => `<button class="choice ${B.arch === k ? 'on' : ''}" data-b="arch" data-i="${k}"><span class="big">${x.e}</span><span class="small">${esc(x.name.replace('The ', ''))}</span></button>`).join('')}</div>
      <h3 style="font-size:16px;margin:16px 0 8px">Your catchphrase:</h3><div class="grid">${PHRASES.map(p => `<button class="choice ${B.phrase === p ? 'on' : ''}" data-b="phrase" data-i="${esc(p)}">“${esc(p)}”</button>`).join('')}</div>
      <div style="margin-top:18px" class="center"><button class="btn green" data-b="lock">🏁 Lock in my racer</button></div>`;
  }
  const canNext = B.step < VIBE.length ? B.picks[B.step] != null : B.step === VIBE.length ? !!B.ride : B.step === VIBE.length + 1 ? !!B.color : false;
  if (B.step < VIBE.length + 2) h += `<div class="row" style="margin-top:18px">${B.step ? '<button class="btn alt" data-b="back">◀ Back</button>' : ''}<span class="grow"></span><button class="btn green" data-b="next" ${canNext ? '' : 'disabled'}>Next ▶</button></div>`;
  else h += `<div class="row" style="margin-top:12px"><button class="btn alt sm" data-b="back">◀ Back</button></div>`;
  return h + '</div>';
}
function scoreVibe(picks) {
  const sc = Object.fromEntries(Object.keys(ARCH).map(k => [k, 0]));
  picks.forEach((i, q) => { if (i == null) return; const tags = VIBE[q].opts[i][1].split(' '); tags.forEach(t => sc[t] += VIBE[q].w); });
  const first = VIBE[0].opts[picks[0]]?.[1];
  return Object.keys(sc).sort((a, b) => sc[b] - sc[a] || (b === first) - (a === first))[0];
}
function builderAct(a, i) {
  const B = S.builder;
  if (a === 'pick') { B.picks[B.step] = +i; B.arch = null; }
  if (a === 'ride') B.ride = i;
  if (a === 'color') B.color = i;
  if (a === 'arch') B.arch = i;
  if (a === 'phrase') B.phrase = i;
  if (a === 'next') B.step++;
  if (a === 'back') B.step = Math.max(0, B.step - 1);
  if (a === 'lock') { S.profile = { arch: B.arch, ride: B.ride, color: B.color, phrase: B.phrase }; cnet && cnet.send({ t: 'profile', profile: S.profile }); }
  sSave();
  if (a === 'lock' && V) V.me.profile = S.profile;
  if (a === 'pick' || a === 'ride' || a === 'color') { const st = B.step; if (st < VIBE.length + 2) setTimeout(() => { if (S.builder === B && B.step === st) { B.step++; sSave(); drawScholar(true); } }, 260); }
  drawScholar(true);
}

/* ---------- time trial simulation ---------- */
function runTimeTrial() {
  if (simRun) return;
  const slow = 12 + Math.floor(Math.random() * 13), fast = 4 + Math.floor(Math.random() * 5);
  const box = $('#simbox'); if (!box) return;
  box.innerHTML = `<div class="track" style="margin-top:14px"><div class="lane" style="height:56px"><div class="finish"></div><div class="runner live" id="simr" style="left:0">${avatar(V.me.profile, 40)}<span class="dist" id="simt">0 s</span></div></div></div><div class="small muted" id="simlbl">Run 1: slow & steady (replay at 4× speed)…</div>`;
  const runs = [slow, fast]; let k = 0, t0 = performance.now();
  simRun = true;
  const step = () => {
    const el = (performance.now() - t0) / 1000 * 4, T = runs[k];
    const f = Math.min(1, el / T);
    const r = $('#simr'); if (!r) { simRun = null; return; }
    r.style.left = (f * 80).toFixed(1) + '%'; $('#simt').textContent = `${Math.min(el, T).toFixed(1)} s`;
    if (f < 1) return requestAnimationFrame(step);
    if (k === 0) { k = 1; t0 = performance.now() + 600; $('#simlbl').textContent = `Slow run: ${slow} s. Run 2: quick & steady…`; return setTimeout(() => requestAnimationFrame(step), 600); }
    simRun = null;
    $('#simlbl').textContent = `Time Trial done: slow ${slow} s, quick ${fast} s. Saved!`;
    cnet.send({ t: 'data', slow, fast, sim: true });
  };
  requestAnimationFrame(step);
}

/* ---------- scholar events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-mk]'); if (!t) return;
  if (IS_HOST) { if (t.dataset.h) hostAct(t.dataset.h, t.dataset.a); return; }
  if (t.dataset.b) return builderAct(t.dataset.b, t.dataset.i);
  if (!V) return;
  const s = SCREENS[V.screen];
  if (t.dataset.mk) { if (V.locked || V.revealed) return; mkLocal.has(t.dataset.mk) ? mkLocal.delete(t.dataset.mk) : mkLocal.add(t.dataset.mk); t.classList.toggle('on'); const c = $('#mkcount'); if (c) c.textContent = mkLocal.size + ' marked'; return; }
  const sa = t.dataset.s;
  if (sa === 'mksend') { if (mkLocal.size < 3) return toast('Mark at least 3 words.'); cnet.send({ t: 'markup', sid: s.id, marks: [...mkLocal] }); return; }
  if (sa === 'ready') { cnet.send({ t: 'ready', sid: s.id }); return; }
  if (sa === 'rebuild') { S.profile = null; S.builder = { step: VIBE.length + 2, picks: S.builder?.picks || [], ride: V.me.profile.ride, color: V.me.profile.color, arch: V.me.profile.arch, phrase: V.me.profile.phrase }; V.me.profile = null; sSave(); drawScholar(true); return; }
  if (sa === 'sim') return runTimeTrial();
  if (sa === 'dsave') {
    const sl = parseNum($('#dslow').value), fa = parseNum($('#dfast').value), err = $('#derr');
    const bad = m => { err.innerHTML = `<div class="fb bad">${m}</div>`; };
    if (sl == null || fa == null) return bad('Type both times in seconds.');
    if (Math.round(sl) < 1 || Math.round(fa) < 1 || sl > 300 || fa > 300) return bad('Times should be between 1 and 300 seconds.');
    if (Math.round(fa) >= Math.round(sl)) return bad('Your QUICK time should be less than your SLOW time. Check with your partner.');
    cnet.send({ t: 'data', slow: Math.round(sl), fast: Math.round(fa), sim: false }); err.innerHTML = '<div class="fb info">Saving…</div>'; return;
  }
  if (t.dataset.cfs != null) { const set = new Set(V.me.cfs || []); const i = +t.dataset.cfs; set.has(i) ? set.delete(i) : set.add(i); cnet.send({ t: 'cfs', items: [...set] }); V.me.cfs = [...set]; drawScholar(true); return; }
  if (t.dataset.opt) {
    const pt = s.parts.find(x => x.id === t.dataset.opt), key = `${s.id}.${pt.id}`, i = +t.dataset.i;
    if (pt.kind === 'multi') { const cur = new Set(drafts[key] || []); cur.has(i) ? cur.delete(i) : cur.add(i); drafts[key] = [...cur]; }
    else drafts[key] = i;
    drawScholar(true); return;
  }
  if (t.dataset.check) {
    const pt = s.parts.find(x => x.id === t.dataset.check), key = `${s.id}.${pt.id}`;
    let v;
    if (pt.kind === 'num') { v = $(`#in-${CSS.escape(key)}`).value; if (parseNum(v) == null) return toast('Type a number first.'); drafts[key] = ''; }
    else if (pt.kind === 'text') { v = $(`#in-${CSS.escape(key)}`).value.trim(); if (!v) return toast('Write your explanation first.'); }
    else { v = drafts[key]; if (v == null || (Array.isArray(v) && !v.length)) return toast('Choose an answer first.'); if (!Array.isArray(v)) drafts[key] = undefined; }
    t.disabled = true; t.textContent = 'Checking…';
    cnet.send({ t: 'answer', sid: s.id, part: pt.id, v });
    if (pt.kind === 'num') { const inp = $(`#in-${CSS.escape(key)}`); if (inp) inp.value = ''; }
    setTimeout(() => { if (t.isConnected && t.textContent === 'Checking…') { t.disabled = false; t.textContent = 'Check'; } }, 4000);
  }
});
document.addEventListener('keydown', e => {
  if (IS_HOST || e.key !== 'Enter') return;
  const inp = e.target.closest('input[data-draft]'); if (!inp || !inp.id.startsWith('in-')) return;
  const btn = inp.parentElement.querySelector('[data-check]'); if (btn) btn.click();
});
document.addEventListener('input', e => { const i = e.target.closest('[data-draft]'); if (i) drafts[i.dataset.draft] = i.value; });
// reset objective local marks when screen changes

/* ---------- boot ---------- */
if (IS_HOST) { document.title = 'Speed Lab · Teacher'; hostStartScreen(); }
else scholarStart();
</script>
</body>
</html>
